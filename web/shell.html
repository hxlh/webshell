<!doctype html>
<html>

<head>
    <style>
        html,
        body,
        #terminal {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Prevent scrollbars */
        }
    </style>
    <link rel="stylesheet" href="/static/css/xterm.css">
    <script src="/static/js/xterm.js"></script>
    <script src="/static/js/xterm-addon-fit.min.js"></script>
</head>

<body>
    <div id="terminal"></div>
    <script>
        const fitAddon = new FitAddon.FitAddon();
        var terminal = new Terminal();
        terminal.loadAddon(fitAddon);
        terminal.open(document.getElementById('terminal'));
        fitAddon.fit(); // Initial fit
        // The logic to send initial size will be handled after socket connection is established or confirmed open.
        terminal.write('Hello from \x1B[1;3;31mxterm.js\x1B[0m $ ')

        var socket = new WebSocket("ws://" + window.location.host + "/ws");
        socket.onmessage = (event) => {
            terminal.write(event.data);
        };

        terminal.onData(data => {
            socket.send(data);
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            socket.send(JSON.stringify({ type: 'resize', cols: terminal.cols, rows: terminal.rows }));
        });

        // Send initial size as well
        // Ensure socket is open before sending initial size
        const sendInitialSize = () => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'resize', cols: terminal.cols, rows: terminal.rows }));
            } else {
                setTimeout(sendInitialSize, 100); // Retry if socket not open yet
            }
        };
        // Call fitAddon.fit() once after terminal is open and then send initial size
        // The initial fitAddon.fit() is already called after terminal.open()
        // We just need to ensure the socket is ready for the initial size message.
        if (socket.readyState === WebSocket.OPEN) {
            sendInitialSize();
        } else {
            socket.onopen = () => {
                sendInitialSize();
            };
        }
    </script>
</body>

</html>
